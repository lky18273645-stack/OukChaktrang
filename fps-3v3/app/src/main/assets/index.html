<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="scope"><div class="h"></div><div class="v"></div></div>
<div id="hud">
  <div id="top"><span id="sCT">0</span><span id="tm">3:00</span><span id="sT">0</span></div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="feed"></div>
  <div id="hp"><i id="hpb"></i><b id="hpt">100</b></div>
  <div id="ammo"><span id="wn">-</span><b id="am">-</b></div>
  <div id="msg"></div>
  <div id="dmg"></div>
  <div id="jbase"><div id="jknob"></div></div>
  <div class="btn" id="bPause">II</div>
  <div class="btn" id="bFire">FIRE</div>
  <div class="btn" id="bAds">ADS</div>
  <div class="btn" id="bJump">JUMP</div>
  <div class="btn" id="bCrouch">CROUCH</div>
  <div class="btn" id="bReload">RLD</div>
  <div class="btn" id="bSwitch">SWAP</div>
</div>
<div id="menu"></div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
