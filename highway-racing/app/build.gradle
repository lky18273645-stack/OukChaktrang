plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lky.highwayrush'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lky.highwayrush'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
