<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Highway Rush</title>
<style>
:root{--a:#ff7a1a;--b:#19d3ff;--pn:rgba(8,12,26,.78);--sl:calc(env(safe-area-inset-left,0px) + 3vw);--sr:calc(env(safe-area-inset-right,0px) + 3vw)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:system-ui,Roboto,"Segoe UI",sans-serif}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:none;pointer-events:none}
.screen.on{display:block}
button{font-family:inherit}
.btn{pointer-events:auto;font-weight:800;font-style:italic;font-size:clamp(13px,4.2vh,22px);line-height:1;letter-spacing:.08em;color:#fff;text-transform:uppercase;background:linear-gradient(180deg,rgba(44,56,92,.92),rgba(14,18,36,.94));border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:2vh 3vh;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer}
.btn:active,.btn.dn{background:linear-gradient(180deg,var(--a),#c24a00);transform:scale(.96)}
.btn.big{background:linear-gradient(180deg,#ff9a3a,#e8590c);border-color:#ffd6b0;font-size:clamp(17px,6vh,30px);padding:2.4vh 4vh;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.panel{pointer-events:auto;background:var(--pn);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:2vh 2.4vh}
.ttl{font-weight:900;font-style:italic;letter-spacing:.12em;font-size:clamp(18px,6.5vh,32px);text-align:center;margin-bottom:1.6vh}
.ttl.red{color:#ff5a3a}
/* menu */
.brand{position:absolute;left:var(--sl);top:7vh}
.logo{font-weight:900;font-style:italic;font-size:clamp(28px,12vh,74px);line-height:.92;letter-spacing:.02em;text-shadow:0 .7vh 0 rgba(0,0,0,.5)}
.logo b{display:block;color:var(--a);font-size:1.12em}
.sub{margin-top:1.6vh;letter-spacing:.38em;font-size:clamp(9px,2.6vh,13px);color:var(--b);font-weight:700;text-shadow:0 1px 4px #000}
.colL{position:absolute;left:var(--sl);bottom:8vh;display:flex;flex-direction:column;gap:1.6vh;width:38vh}
.bestbox{position:absolute;right:var(--sr);bottom:8vh;text-align:right;font-weight:800;letter-spacing:.2em;font-size:clamp(10px,2.8vh,14px);color:#cfe;text-shadow:0 1px 4px #000}
.bestbox b{display:block;font-size:clamp(22px,8vh,40px);letter-spacing:.04em;color:#fff;font-style:italic}
/* garage */
.gtitle{position:absolute;left:0;right:0;top:3.5vh;text-align:center;text-shadow:0 2px 8px #000}
.gtitle b{display:block;font-size:clamp(20px,8vh,40px);font-style:italic;font-weight:900;letter-spacing:.08em}
.gtitle small{letter-spacing:.3em;font-size:clamp(9px,2.6vh,13px);color:var(--b);font-weight:700}
.gL{position:absolute;left:var(--sl);top:50%;transform:translateY(-45%);width:36vh}
.gR{position:absolute;right:var(--sr);top:50%;transform:translateY(-50%);width:36vh;display:flex;flex-direction:column;gap:1.4vh}
.st{margin-bottom:1.8vh;font-size:clamp(9px,2.6vh,13px);font-weight:800;letter-spacing:.14em}
.st span{display:block;color:#9fb4d8;margin-bottom:.5vh}
.st i{display:block;height:1.4vh;background:rgba(255,255,255,.14);border-radius:1vh;overflow:hidden}
.st u{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--b),var(--a));border-radius:1vh;transition:width .25s}
.st em{display:block;font-style:normal;margin-top:.4vh;text-align:right;color:#fff}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(18px,7vh,34px);padding:2.2vh 2.6vh;left:calc(var(--sl) + 40vh)}
.nav.r{left:auto;right:calc(var(--sr) + 40vh)}
.lbl{font-weight:800;letter-spacing:.2em;font-size:clamp(9px,2.6vh,13px);color:#9fb4d8}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:1vh}
.sw div{pointer-events:auto;aspect-ratio:1;border-radius:50%;border:.5vh solid rgba(255,255,255,.35)}
.sw div.on{border-color:#fff;box-shadow:0 0 0 .5vh var(--a)}
/* settings */
.setp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,170vh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 2.4vh}
.row .l{font-weight:800;letter-spacing:.14em;font-size:clamp(8px,2.3vh,12px);color:#9fb4d8;margin-bottom:.6vh}
.seg{display:flex;gap:.6vh}
.seg button{pointer-events:auto;flex:1;font-weight:800;font-size:clamp(9px,2.7vh,13px);letter-spacing:.05em;padding:1.3vh .4vh;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px}
.seg button.on{background:var(--a);border-color:#ffd6b0}
.note{margin:1.4vh 0;text-align:center;font-size:clamp(8px,2.2vh,11px);color:#8aa}
.setp .btn{display:block;margin:0 auto}
/* hud */
#hScore{position:absolute;left:var(--sl);top:2.5vh;font-weight:900;font-style:italic;text-shadow:0 2px 6px #000}
#hScore small{display:block;font-size:clamp(8px,2.4vh,12px);letter-spacing:.25em;color:var(--b)}
#hScore b{font-size:clamp(20px,8vh,40px)}
#hCombo{position:absolute;left:var(--sl);top:15vh;font-weight:900;font-style:italic;font-size:clamp(16px,6vh,30px);color:var(--a);text-shadow:0 2px 6px #000}
#hDist{position:absolute;left:0;right:0;top:2.5vh;text-align:center;font-weight:800;font-size:clamp(11px,3.4vh,17px);text-shadow:0 2px 6px #000;letter-spacing:.06em}
#hDist span{color:#cfe;font-size:.85em}
#b-pause{position:absolute;right:var(--sr);top:2.5vh;padding:1.4vh 2vh;font-size:clamp(12px,4vh,20px);font-style:normal}
#gauge{position:absolute;left:50%;bottom:1.5vh;transform:translateX(-50%);width:27vh;height:27vh}
#ring{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;--p:0;transform:rotate(-135deg);background:conic-gradient(var(--b) 0turn,var(--a) calc(var(--p)*.75turn),rgba(255,255,255,.16) calc(var(--p)*.75turn),rgba(255,255,255,.16) .75turn,transparent .75turn);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
#gauge .num{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 6px #000}
#gauge .num b{font-size:clamp(22px,9vh,46px);font-style:italic;font-weight:900;line-height:1}
#gauge .num small{font-size:clamp(7px,2.2vh,11px);letter-spacing:.2em;color:var(--b);font-weight:800}
#nitro{position:absolute;right:var(--sr);bottom:30vh;width:44vh}
#nitro small{display:block;text-align:right;font-weight:800;letter-spacing:.25em;font-size:clamp(8px,2.2vh,11px);color:var(--b);text-shadow:0 1px 4px #000}
#nitro .bar{height:2vh;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:2vh;overflow:hidden;margin-top:.4vh}
#nitro i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#1aa7ff,#9af0ff)}
#pop{position:absolute;left:0;right:0;top:24vh;text-align:center;font-weight:900;font-style:italic;font-size:clamp(16px,6.5vh,32px);color:#ffe36a;text-shadow:0 2px 8px #000;opacity:0}
#pop.go{animation:pp .9s ease-out}
@keyframes pp{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-3vh)}}
#count{position:absolute;left:0;right:0;top:28vh;text-align:center;font-weight:900;font-style:italic;font-size:clamp(40px,22vh,120px);color:#fff;text-shadow:0 .6vh 0 rgba(255,122,26,.9),0 0 3vh #000;opacity:0}
#count.go{animation:cc .8s ease-out}
@keyframes cc{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#fps{position:absolute;left:var(--sl);top:21vh;font:700 11px monospace;color:#9f9;text-shadow:0 1px 3px #000;display:none}
#ctl-l{position:absolute;left:var(--sl);bottom:3vh}
#ctl-r{position:absolute;right:var(--sr);bottom:3vh;display:flex;gap:2vh}
#pad{display:flex;gap:2vh}
.dir{width:24vh;height:22vh;padding:0;display:flex;align-items:center;justify-content:center;font-size:9vh;font-style:normal;opacity:.85}
.act{width:21vh;height:21vh;border-radius:50%;padding:0;font-size:clamp(11px,3.4vh,17px);opacity:.88}
.act.brk{background:linear-gradient(180deg,#ff5a4a,#a01010);border-color:#ffc0b8}
.act.nit{background:linear-gradient(180deg,#34c4ff,#0a5fc2);border-color:#c0ecff}
.act:active,.act.dn{transform:scale(.93);filter:brightness(1.3);background:none}
.act.brk.dn{background:#ff2a1a}.act.nit.dn{background:#19d3ff}
#wheel{pointer-events:auto;width:30vh;height:30vh;border-radius:50%;background:rgba(10,14,28,.28);display:none}
#wheel .wh{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;border:1.3vh solid rgba(255,255,255,.7);box-shadow:0 0 0 .3vh rgba(0,0,0,.5),inset 0 0 0 .3vh rgba(0,0,0,.5)}
#wheel .wh:before{content:"";position:absolute;left:8%;right:8%;top:calc(50% - .8vh);height:1.6vh;background:rgba(255,255,255,.7);border-radius:1vh}
#wheel .wh:after{content:"";position:absolute;left:calc(50% - .8vh);top:50%;bottom:8%;width:1.6vh;background:rgba(255,255,255,.7);border-radius:1vh}
#wheel .wh i{position:absolute;left:calc(50% - 1.3vh);top:-1.3vh;width:2.6vh;height:3.2vh;background:var(--a);border-radius:.8vh;z-index:2}
#tiltI{display:none;width:30vh;height:7vh;position:relative;background:rgba(10,14,28,.4);border:1px solid rgba(255,255,255,.3);border-radius:5vh}
#tiltI small{position:absolute;left:0;right:0;bottom:-3vh;text-align:center;font-weight:800;letter-spacing:.2em;font-size:clamp(7px,2vh,10px);color:#cfe}
#tiltI i{position:absolute;left:calc(50% - 2.5vh);top:1vh;width:5vh;height:5vh;border-radius:50%;background:var(--a)}
.c0 #pad{display:flex}.c0 #wheel,.c0 #tiltI{display:none}
.c1 #pad,.c1 #tiltI{display:none}.c1 #wheel{display:block}
.c2 #pad,.c2 #wheel{display:none}.c2 #tiltI{display:block}
/* pause + over */
.cen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(60vw,64vh);display:flex;flex-direction:column;gap:1.6vh}
.res{display:flex;justify-content:space-between;text-align:center;font-weight:800;letter-spacing:.15em;font-size:clamp(8px,2.3vh,12px);color:#9fb4d8}
.res b{display:block;font-size:clamp(16px,6vh,30px);color:#fff;font-style:italic;letter-spacing:.02em}
#o-new{text-align:center;color:#ffe36a;font-weight:900;font-style:italic;letter-spacing:.1em;min-height:3vh;font-size:clamp(11px,3.4vh,17px)}
.row2{display:flex;gap:1.4vh}.row2 .btn{flex:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="s-menu" class="screen on">
    <div class="brand"><div class="logo">HIGHWAY<b>RUSH</b></div><div class="sub">3D OFFLINE RACING</div></div>
    <div class="colL">
      <button class="btn big" id="b-drive">DRIVE</button>
      <button class="btn" id="b-garage">GARAGE</button>
      <button class="btn" id="b-settings">SETTINGS</button>
    </div>
    <div class="bestbox">BEST SCORE<b id="m-best">0</b></div>
  </div>

  <div id="s-garage" class="screen">
    <div class="gtitle"><b id="g-name"></b><small id="g-cls"></small></div>
    <div class="panel gL">
      <div class="st"><span>TOP SPEED</span><i><u id="st0"></u></i><em id="sv0"></em></div>
      <div class="st"><span>ACCELERATION</span><i><u id="st1"></u></i><em id="sv1"></em></div>
      <div class="st" style="margin-bottom:0"><span>HANDLING</span><i><u id="st2"></u></i><em id="sv2"></em></div>
    </div>
    <button class="btn nav" id="g-prev">&#9664;</button>
    <button class="btn nav r" id="g-next">&#9654;</button>
    <div class="panel gR">
      <div class="lbl">PAINT</div>
      <div class="sw" id="g-sw"></div>
      <button class="btn big" id="g-go">DRIVE</button>
      <button class="btn" id="g-back">BACK</button>
    </div>
  </div>

  <div id="s-settings" class="screen">
    <div class="panel setp">
      <div class="ttl">SETTINGS</div>
      <div class="grid" id="set-grid"></div>
      <div class="note">HIGH enables anti-aliasing after the next app launch.</div>
      <button class="btn" id="set-back">BACK</button>
    </div>
  </div>

  <div id="s-hud" class="screen c0">
    <div id="hScore"><small>SCORE</small><b id="v-score">0</b></div>
    <div id="hCombo"></div>
    <div id="hDist"><b id="v-dist">0</b> m <span>&middot; BEST <b id="v-best">0</b></span></div>
    <button class="btn" id="b-pause">&#10074;&#10074;</button>
    <div id="fps"></div>
    <div id="gauge"><div id="ring"></div><div class="num"><b id="v-speed">0</b><small>KM/H</small></div></div>
    <div id="nitro"><small>NITRO</small><div class="bar"><i id="v-nitro"></i></div></div>
    <div id="pop"></div>
    <div id="count"></div>
    <div id="ctl-l">
      <div id="pad"><button class="btn dir" id="b-left">&#9664;</button><button class="btn dir" id="b-right">&#9654;</button></div>
      <div id="wheel"><div class="wh"><i></i></div></div>
      <div id="tiltI"><i id="tiltDot"></i><small>TILT TO STEER</small></div>
    </div>
    <div id="ctl-r">
      <button class="btn act brk" id="b-brake">BRAKE</button>
      <button class="btn act nit" id="b-nitro">NITRO</button>
    </div>
  </div>

  <div id="s-pause" class="screen">
    <div class="panel cen">
      <div class="ttl">PAUSED</div>
      <button class="btn big" id="p-res">RESUME</button>
      <button class="btn" id="p-re">RESTART</button>
      <button class="btn" id="p-menu">MAIN MENU</button>
    </div>
  </div>

  <div id="s-over" class="screen">
    <div class="panel cen">
      <div class="ttl red">CRASHED!</div>
      <div class="res"><div>SCORE<b id="o-score">0</b></div><div>DISTANCE<b id="o-dist">0</b></div><div>BEST<b id="o-best">0</b></div></div>
      <div id="o-new"></div>
      <button class="btn big" id="o-retry">RETRY</button>
      <div class="row2"><button class="btn" id="o-garage">GARAGE</button><button class="btn" id="o-menu">MENU</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
window.addEventListener('error',function(e){try{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;right:0;z-index:99;background:#500;color:#fff;font:12px monospace;padding:4px;pointer-events:none';d.textContent='ERR '+e.message+' @'+e.lineno;document.body.appendChild(d);}catch(_){}});

/* ================= helpers ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let seed=1;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const AB=(typeof window.Android!=='undefined')?window.Android:null;
function sget(k,d){try{const v=AB?AB.load(k):localStorage.getItem(k);if(v===null||v===undefined||v==='')return d;return JSON.parse(v);}catch(e){return d;}}
function sset(k,v){try{const s=JSON.stringify(v);if(AB)AB.save(k,s);else localStorage.setItem(k,s);}catch(e){}}
function vib(ms){if(S.hap&&AB&&AB.vibrate){try{AB.vibrate(ms);}catch(e){}}}

/* ================= settings ================= */
const DEF={q:1,ctl:0,snd:1,vol:0.6,tod:0,fps:0,inv:0,sens:1,hap:1,car:0,col:[0,1,2,3,4,5]};
const S=Object.assign({},DEF,sget('hr_set',{}));
if(!Array.isArray(S.col)||S.col.length<6)S.col=[0,1,2,3,4,5];
S.q=clamp(S.q|0,0,2);S.ctl=clamp(S.ctl|0,0,2);S.car=clamp(S.car|0,0,5);
let best=+sget('hr_best',0)||0;
function saveS(){sset('hr_set',S);}

const PAL=[[.85,.08,.08],[.1,.34,.9],[.95,.75,.1],[.1,.68,.34],[.94,.94,.94],[.07,.07,.09],[.95,.45,.05],[.55,.2,.85],[.1,.78,.84],[.6,.62,.66]];
const QS=[
 {n:'LOW',sc:.6,seg:9,tr:8,pt:24,lamp:0,lines:10},
 {n:'MEDIUM',sc:.9,seg:11,tr:12,pt:48,lamp:10,lines:22},
 {n:'HIGH',sc:1,seg:12,tr:16,pt:96,lamp:18,lines:32}
];
let Q=QS[S.q];

const CARS=[
 {n:'AURORA GT',d:'Sports Coupe',f:'coupe',L:4.3,W:1.82,cl:.16,bh:.5,nose:.55,tail:.35,cF:-.5,cB:1.45,ws:.75,rs:.7,ch:.44,wr:.33,ww:.13,af:1.32,ar:1.28,top:225,acc:14,hnd:.78},
 {n:'THUNDER V8',d:'Muscle Car',f:'muscle',L:4.8,W:1.95,cl:.18,bh:.58,nose:.5,tail:.3,cF:-.2,cB:1.6,ws:.6,rs:.5,ch:.4,wr:.36,ww:.16,af:1.5,ar:1.45,top:240,acc:17,hnd:.55},
 {n:'VELOCE RS',d:'Supercar',f:'super',L:4.5,W:2.0,cl:.12,bh:.38,nose:.9,tail:.5,cF:-.9,cB:1.1,ws:.85,rs:.55,ch:.36,wr:.34,ww:.17,af:1.45,ar:1.35,top:275,acc:19,hnd:.85},
 {n:'METRO SE',d:'Sedan',f:'sedan',L:4.7,W:1.82,cl:.2,bh:.58,nose:.45,tail:.4,cF:-.55,cB:1.65,ws:.75,rs:.6,ch:.52,wr:.34,ww:.12,af:1.4,ar:1.45,top:205,acc:11,hnd:.68},
 {n:'RANGER X',d:'Off-road SUV',f:'suv',L:4.4,W:1.95,cl:.35,bh:.85,nose:.35,tail:.15,cF:-.7,cB:2.0,ws:.5,rs:.25,ch:.62,wr:.45,ww:.18,af:1.35,ar:1.3,top:190,acc:10,hnd:.5},
 {n:'PHANTOM Z',d:'Hypercar',f:'hyper',L:4.6,W:2.05,cl:.1,bh:.34,nose:1.0,tail:.6,cF:-.8,cB:1.0,ws:.8,rs:.5,ch:.34,wr:.35,ww:.18,af:1.5,ar:1.4,top:320,acc:23,hnd:.95}
];
const VAN={f:'van',L:5.2,W:2.0,cl:.32,bh:.95,nose:.45,tail:.1,cF:-1.1,cB:2.5,ws:.7,rs:.1,ch:.85,wr:.4,ww:.15,af:1.7,ar:1.5};

/* ================= WebGL ================= */
const cv=$('c');
let gl=null;
const attrs={antialias:S.q===2,alpha:false,depth:true,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false};
try{gl=cv.getContext('webgl',attrs)||cv.getContext('experimental-webgl',attrs);}catch(e){gl=null;}
if(!gl){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font:18px sans-serif;background:#0b1020;z-index:50">WebGL is not available on this device.</div>');return;}
cv.addEventListener('webglcontextlost',function(e){e.preventDefault();});
cv.addEventListener('webglcontextrestored',function(){location.reload();});

function mkProg(vs,fs,attribs,unis){
  const p=gl.createProgram();
  const add=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));gl.attachShader(p,s);};
  add(gl.VERTEX_SHADER,vs);add(gl.FRAGMENT_SHADER,fs);
  attribs.forEach((n,i)=>gl.bindAttribLocation(p,i,n));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};unis.forEach(n=>{u[n]=gl.getUniformLocation(p,n);});
  return {p:p,u:u};
}
const PREC='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
const MP=mkProg(
 'attribute vec3 aPos;attribute vec3 aNrm;attribute vec4 aCol;uniform mat4 uVP;uniform mat4 uM;varying vec4 vCol;varying vec3 vN;varying vec3 vW;'+

const VP=new Float32Array(16),VW=new Float32Array(16),PJ=new Float32Array(16),MM=new Float32Array(16),MC=new Float32Array(16),MW=new Float32Array(16),ML=new Float32Array(16);
function m4persp(o,fy,a,n,f){const t=1/Math.tan(fy/2);o.fill(0);o[0]=t/a;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);}
function m4look(o,ex,ey,ez,cx,cy,cz){
  let zx=ex-cx,zy=ey-cy,zz=ez-cz;let l=1/Math.hypot(zx,zy,zz);zx*=l;zy*=l;zz*=l;
  let xx=zz,xy=0,xz=-zx; // up=(0,1,0) x z
  l=1/Math.hypot(xx,xy,xz);xx*=l;xy*=l;xz*=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);o[13]=-(yx*ex+yy*ey+yz*ez);o[14]=-(zx*ex+zy*ey+zz*ez);o[15]=1;
}
function m4mul(o,a,b){for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
  o[c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
  o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}}
function m4model(o,x,y,z,yaw,pit,rol,s){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pit),sx=Math.sin(pit),cz=Math.cos(rol),sz=Math.sin(rol);
  const a00=cz,a01=-sz,a10=cx*sz,a11=cx*cz,a12=-sx,a20=sx*sz,a21=sx*cz,a22=cx;
  const r00=cy*a00+sy*a20,r01=cy*a01+sy*a21,r02=sy*a22;
  const r20=-sy*a00+cy*a20,r21=-sy*a01+cy*a21,r22=cy*a22;
  o[0]=r00*s;o[1]=a10*s;o[2]=r20*s;o[3]=0;
  o[4]=r01*s;o[5]=a11*s;o[6]=r21*s;o[7]=0;
  o[8]=r02*s;o[9]=a12*s;o[10]=r22*s;o[11]=0;
  o[12]=x;o[13]=y;o[14]=z;o[15]=1;
}
function m4trans(o,x,y,z){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;o[12]=x;o[13]=y;o[14]=z;}

/* ================= mesh building ================= */
function newMesh(){return {v:[],n:0,buf:null};}
function fin(m){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(m.v),gl.STATIC_DRAW);m.buf=b;m.n=m.v.length/10;m.v=null;return m;}
function poly(m,pts,col,flag,cen){
  const n=pts.length;let nx=0,ny=0,nz=0,fx=0,fy=0,fz=0;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);fx+=a[0];fy+=a[1];fz+=a[2];}
  const l=Math.hypot(nx,ny,nz);if(l<1e-9)return;nx/=l;ny/=l;nz/=l;fx/=n;fy/=n;fz/=n;
  let P=pts;
  if(cen&&(nx*(fx-cen[0])+ny*(fy-cen[1])+nz*(fz-cen[2]))<0){nx=-nx;ny=-ny;nz=-nz;P=pts.slice().reverse();}
  const r=col[0],g=col[1],b=col[2],a=flag/3,v=m.v;
  for(let i=1;i<n-1;i++){const t0=P[0],t1=P[i],t2=P[i+1];
    v.push(t0[0],t0[1],t0[2],nx,ny,nz,r,g,b,a,t1[0],t1[1],t1[2],nx,ny,nz,r,g,b,a,t2[0],t2[1],t2[2],nx,ny,nz,r,g,b,a);}
}
const FF=[[0,1,5,4],[2,3,7,6],[3,0,4,7],[1,2,6,5],[4,5,6,7],[3,2,1,0]];
function frus(m,y0,y1,w0,w1,zf0,zb0,zf1,zb1,col,flag,ox){
  ox=ox||0;
  const c=[[ox-w0,y0,zf0],[ox+w0,y0,zf0],[ox+w0,y0,zb0],[ox-w0,y0,zb0],[ox-w1,y1,zf1],[ox+w1,y1,zf1],[ox+w1,y1,zb1],[ox-w1,y1,zb1]];
  const cen=[ox,(y0+y1)/2,(zf0+zb0+zf1+zb1)/4];
  for(let i=0;i<6;i++){const f=FF[i];poly(m,[c[f[0]],c[f[1]],c[f[2]],c[f[3]]],col,flag,cen);}
}
function box(m,cx,cy,cz,sx,sy,sz,col,flag){frus(m,cy-sy/2,cy+sy/2,sx/2,sx/2,cz-sz/2,cz+sz/2,cz-sz/2,cz+sz/2,col,flag,cx);}
function flat(m,x0,x1,z0,z1,y,col,flag){poly(m,[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],col,flag,[(x0+x1)/2,y-1,(z0+z1)/2]);}
function cylX(m,cx,cy,cz,r,hw,seg,col,flag,colEnd){
  const cen=[cx,cy,cz],ring=[];
  for(let i=0;i<seg;i++){const a=i/seg*6.2831853;ring.push([cy+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  const capA=[],capB=[];
  for(let i=0;i<seg;i++){const p=ring[i],q=ring[(i+1)%seg];
    poly(m,[[cx-hw,p[0],p[1]],[cx+hw,p[0],p[1]],[cx+hw,q[0],q[1]],[cx-hw,q[0],q[1]]],col,flag,cen);
    capA.push([cx-hw,p[0],p[1]]);capB.push([cx+hw,p[0],p[1]]);}
  poly(m,capA,colEnd||col,flag,cen);poly(m,capB,colEnd||col,flag,cen);
}

/* ================= cars ================= */
const WHITE=[1,1,1],GLASS=[.07,.1,.15],DARK=[.06,.06,.07],TIRE=[.045,.045,.05],RIM=[.72,.74,.78],CHR=[.8,.82,.85],SHD=[.03,.03,.035];
function wheelsMerged(m,d,seg){
  const hw=d.W/2,x=hw-d.ww*.8;
  [[-1,-d.af],[1,-d.af],[-1,d.ar],[1,d.ar]].forEach(function(w){
    cylX(m,w[0]*x,d.wr,w[1],d.wr,d.ww,seg,TIRE,0);
    cylX(m,w[0]*(x+d.ww*.45),d.wr,w[1],d.wr*.62,d.ww*.62,seg,RIM,0);
  });
}
function buildCar(d,player){
  const body=newMesh(),tail=player?newMesh():body,hw=d.W/2,zF=-d.L/2,zB=d.L/2,y0=d.cl,y1=d.cl+d.bh;
  const f=d.f;
  frus(body,y0,y1,hw*.96,hw,zF,zB,zF+d.nose,zB-d.tail,WHITE,1,0);
  const cw0=hw*.9,cw1=hw*.78,yT=y1+d.ch,t0=d.cF+d.ws,t1=d.cB-d.rs;
  if(f==='van'){
    frus(body,y1,yT,cw0,cw1,d.cF,d.cB,t0,t1,WHITE,1,0);
    poly(body,[[-cw0*.92,y1+.06,d.cF-.01],[cw0*.92,y1+.06,d.cF-.01],[cw1*.92,yT-.08,t0-.01],[-cw1*.92,yT-.08,t0-.01]],GLASS,0,[0,(y1+yT)/2,(d.cF+d.cB)/2]);
    [-1,1].forEach(function(s){box(body,s*(cw0+.01),y1+d.ch*.55,d.cF+.6,.03,d.ch*.38,1.0,GLASS,0);});
  }else{
    frus(body,y1,yT,cw0,cw1,d.cF,d.cB,t0,t1,GLASS,0,0);
    frus(body,yT-.01,yT+.05,cw1,cw1,t0,t1,t0,t1,WHITE,1,0);
    [-1,1].forEach(function(s){box(body,s*(cw0+.07),y1+.06,d.cF+.25,.14,.1,.22,WHITE,1);});
  }
  const hz=zF+d.nose*.5,hy=y0+d.bh*.55;
  [-1,1].forEach(function(s){box(body,s*hw*.66,hy,hz,.36,.1,.1,[1,.95,.8],2);});
  box(body,0,y0+d.bh*.3,zF+d.nose*.25,hw*.9,.14,.08,DARK,0);
  const tz=zB-d.tail*.5,ty=y0+d.bh*.6;
  [-1,1].forEach(function(s){box(tail,s*hw*.62,ty,tz,.46,.1,.1,player?WHITE:[.85,.05,.05],2);});
  box(body,0,y0+.06,zB-.04,hw*1.4,.1,.1,DARK,0);
  const stripe=[.95,.95,.95];
  if(f==='coupe'){
    box(body,0,y1+.08,zB-d.tail-.05,d.W*.8,.04,.25,WHITE,1);
  }else if(f==='muscle'){
    box(body,0,y1+.07,zF+d.nose+.9,.55,.13,.9,DARK,0);
    [-.22,.22].forEach(function(x){
      box(body,x,y1+.008,(zF+d.nose+d.cF)/2,.2,.014,d.cF-(zF+d.nose),stripe,0);
      box(body,x,yT+.058,(t0+t1)/2,.2,.014,t1-t0,stripe,0);
      box(body,x,y1+.008,(d.cB+zB-d.tail)/2,.2,.014,zB-d.tail-d.cB,stripe,0);
    });
    box(body,0,y1+.1,zB-d.tail-.05,d.W*.85,.05,.3,WHITE,1);
    [-1,1].forEach(function(s){box(body,s*.6,y0+.04,zB+.03,.16,.1,.14,CHR,0);});
  }else if(f==='super'||f==='hyper'){
    const wy=y1+(f==='hyper'?.5:.42);
    box(body,0,wy,zB-.2,d.W*.9,.04,.36,DARK,0);
    [-1,1].forEach(function(s){
      box(body,s*.45,y1+.2,zB-.2,.05,.4,.1,DARK,0);
      box(body,s*d.W*.45,wy,zB-.2,.04,.18,.42,WHITE,1);
      box(body,s*hw,y0+d.bh*.5,.9,.05,.14,.7,DARK,0);
    });
    box(body,0,y0-.03,zF+.05,d.W*.95,.03,.35,DARK,0);
    if(f==='hyper'){
      [-1,1].forEach(function(s){box(body,s*.58,y1+.2,zB-.75,.05,.4,.9,WHITE,1);});
      box(body,0,y0+.02,0,d.W*1.01,.035,d.L*.62,[.1,.8,1],2);
      box(body,0,y1+.008,(zF+d.nose+d.cF)/2,.22,.014,d.cF-(zF+d.nose),[.1,.8,1],2);
    }
  }else if(f==='suv'){
    const rl=t1-t0;
    [-1,1].forEach(function(s){box(body,s*(cw1-.12),yT+.08,(t0+t1)/2,.04,.06,rl,DARK,0);});
    [.15,.5,.85].forEach(function(k){box(body,0,yT+.08,t0+rl*k,cw1*2-.2,.05,.06,DARK,0);});
    box(body,0,y0+.25,zF+.05,d.W*.7,.1,.1,DARK,0);
    [-1,1].forEach(function(s){box(body,s*.3,y0+.45,zF+.1,.06,.5,.06,DARK,0);});
    box(body,0,y0+d.bh*.6,zB+.1,.75,.75,.22,DARK,0);
    box(body,0,y0+d.bh*.6,zB+.22,.3,.3,.03,CHR,0);
  }else if(f==='sedan'){
    box(body,0,hy,zF+d.nose*.5+.02,hw*.5,.06,.1,CHR,0);
  }
  if(player){
    const w=newMesh(),sh=newMesh();
    box(sh,0,.03,0,d.W*1.06,.02,d.L*1.03,SHD,0);
    return {body:fin(body),tail:fin(tail),shadow:fin(sh),wheel:buildWheel(d),d:d};
  }
  wheelsMerged(body,d,10);
  box(body,0,.03,0,d.W*1.06,.02,d.L*1.03,SHD,0);

function buildWheel(d){
  const m=newMesh(),r=d.wr,w=d.ww;
  cylX(m,0,0,0,r,w,12,TIRE,0);
  [-1,1].forEach(function(s){cylX(m,s*w*.45,0,0,r*.62,w*.62,12,RIM,0);});
  box(m,0,0,0,w*2.3,r*1.1,.07,[.12,.12,.14],0);
  box(m,0,0,0,w*2.3,.07,r*1.1,[.12,.12,.14],0);
  return fin(m);
}
function buildTruck(){
  const m=newMesh();
  box(m,0,.8,0,2.0,.4,9.0,DARK,0);
  frus(m,.7,2.6,1.2,1.2,-4.7,-2.5,-4.45,-2.5,WHITE,1,0);
  box(m,0,2.05,-4.56,2.2,.75,.08,GLASS,0);
  box(m,0,2.55,1.25,2.5,3.1,6.9,[.82,.84,.88],0);
  box(m,0,2.55,4.72,2.3,2.9,.04,[.7,.72,.76],0);
  [-1,1].forEach(function(s){
    box(m,s*.85,1.1,-4.72,.35,.2,.06,[1,.95,.8],2);
    box(m,s*.8,.95,4.74,.4,.2,.06,[.85,.05,.05],2);
    [-3.6,2.6,3.9].forEach(function(z){
      cylX(m,s*1.0,.5,z,.5,.2,10,TIRE,0);
      cylX(m,s*1.1,.5,z,.3,.12,10,RIM,0);
    });
  });
  box(m,0,.05,0,2.7,.02,9.6,SHD,0);
  return {m:fin(m),hw:1.25,hl:4.8,truck:1};
}

  frus(m,2.4*s,4.7*s,1.05*s,.05,z-1.05*s,z+1.05*s,z-.05,z+.05,[.11+g,.36+g,.14+g],0,x);}
function rock(m,x,z,s){const g=rr(-.05,.05),w=rr(1,2.6)*s,h=rr(.8,2.2)*s,d=rr(1,2.4)*s;
  frus(m,0,h,w,w*.4,z-d,z+d,z-d*.4,z+d*.4,[.42+g,.38+g,.34+g],0,x);}

  frus(m,h,h+2.2,w/2*1.06,.1,z-d/2*1.06,z+d/2*1.06,z-.1,z+.1,[.5,.2,.15],0,x);

function windowsX(m,xf,z,d,h,cenx){
  const cols=Math.max(1,Math.floor(d/2.8)),rows=Math.max(1,Math.floor(h/3.4));
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){

  }
}

function bridge(m,z){
  const C=[.5,.5,.52];

function doCrash(t){
  if(P.crash)return;
  P.crash=1;P.crashT=0;P.shake=3;P.spin=(Math.random()-.5)*9;P.rollV=(Math.random()-.5)*8;P.vy=4+Math.random()*3;
  P.vx+=(P.x-t.x>=0?1:-1)*4;
  const px=P.x;
  for(let i=0;i<30;i++)emit(px+(Math.random()-.5)*1.5,.5,-2+Math.random()*3,(Math.random()-.5)*14,Math.random()*9,(Math.random()-.5)*14,.5+Math.random()*.6,.06,0);
  for(let i=0;i<6;i++)emit(px+(Math.random()-.5),.8,-1+Math.random()*2,(Math.random()-.5)*4,2+Math.random()*3,(Math.random()-.5)*4,.7,1.0,1);
  for(let i=0;i<8;i++)emit(px+(Math.random()-.5),.8,-1+Math.random()*2,(Math.random()-.5)*3,1+Math.random()*3,-Math.random()*3,1.4,.9,2);
  Snd.crash();vib(140);
  const sc=Math.floor(P.score);if(sc>best){P.newBest=true;best=sc;sset('hr_best',best);}else P.newBest=false;
  Snd.update(50,300,0,.1,0,0);

function nearMiss(){
  if(P.comboT>0)P.combo=Math.min(9,P.combo+1);else P.combo=1;
  P.comboT=4;const b=100*P.combo;P.score+=b;P.nitro=Math.min(1,P.nitro+.1);
  popup('NEAR MISS +'+b);Snd.near();vib(12);
}
function updTraffic(dt,go){
  const car=CARS[S.car];
  for(let i=0;i<NT;i++){
    const t=TR[i];if(!t.on)continue;
    t.z+=(P.speed-t.sp)*dt;
    if(t.lc){const dx=t.tx-t.x,st=2.8*dt;if(Math.abs(dx)<=st){t.x=t.tx;t.lc=0;}else t.x+=dx>0?st:-st;}
    else{t.ct-=dt;if(t.ct<=0){t.ct=3+Math.random()*6;tryLane(t);}}
    for(let j=0;j<NT;j++){const u=TR[j];if(u===t||!u.on)continue;
      if(Math.abs(u.x-t.x)<2.4&&u.z<t.z&&t.z-u.z<t.hl+u.hl+9&&t.sp>u.sp)t.sp=u.sp;}
    if(t.z>40||t.z<-(FAR+80)){t.on=0;continue;}
    if(go){
      const ox=Math.abs(t.x-P.x),oz=Math.abs(t.z),sw=t.hw+.88,sl=t.hl+car.L*.47;
      if(ox<sw-.1&&oz<sl-.15){doCrash(t);return;}
      if(oz<sl+.4){t.al=1;if(ox<t.mg)t.mg=ox;}
      else if(t.al&&!t.sc){t.sc=1;if(t.mg<sw+.95)nearMiss();}
    }
  }
}
function updateWorld(dt,sv){
  scrollV=sv;
  const mv=sv*dt;
  for(let i=0;i<SG.length;i++){const s=SG[i];s.z+=mv;if(s.z>80){s.z-=SG.length*SEGL;s.v=pickVar();}}
  updParticles(dt);
  const sp01=clamp((sv-30)/50,0,1);
  for(let i=0;i<Q.lines;i++){lnZ[i]+=(sv*1.1+20)*dt;if(lnZ[i]>12)resetLine(i,false);}
  if(S.tod===0){todU+=dt*(4/220);if(todU>=4)todU-=4;}else todU=S.tod-1;
  time+=dt;
}
let hc={sp:-1,sc:-1,dist:-1,nit:-1,combo:-1};
function updatePlay(dt){
  const car=CARS[S.car],topMS=car.top/3.6;
  let ts=1;
  if(P.crash){P.crashT+=dt;ts=P.crashT<.9?.28:.7;}
  const d=dt*ts;
  if(P.cd>0){
    P.cd-=dt;const n=Math.ceil(P.cd/.8);
    if(n!==lastCnt){lastCnt=n;if(n>0){showCount(String(n));Snd.blip(520);}else{showCount('GO!');Snd.blip(880);}}
    if(P.cd<0)P.cd=0;
  }
  const go=P.cd<=0&&!P.crash;
  if(S.ctl===0){const st=(IN.r?1:0)-(IN.l?1:0);P.steerS+=(st-P.steerS)*Math.min(1,dt*9);}
  else if(S.ctl===1){P.steerS=IN.wheel;}
  else{P.steerS+=(IN.tilt-P.steerS)*Math.min(1,dt*14);}
  const nit=go&&IN.nit&&P.nitro>.001&&!IN.brk;
  if(nit&&!P.nitOn)Snd.nitro();
  P.nitOn=nit;
  const topEff=topMS*(nit?1.3:1);
  if(go){
    if(P.speed<topEff){P.speed+=car.acc*(nit?1.9:1)*Math.max(.07,1-Math.pow(P.speed/topEff,1.6))*d;if(P.speed>topEff)P.speed=topEff;}
    else P.speed=Math.max(topEff,P.speed-8*d);
    if(IN.brk)P.speed=Math.max(0,P.speed-34*d);
    P.nitro=nit?Math.max(0,P.nitro-.27*d):Math.min(1,P.nitro+.035*d);
  }else if(P.crash){P.speed=Math.max(0,P.speed-(8+P.speed*1.1)*d);}
  P.nfx+=((nit?1:0)-P.nfx)*Math.min(1,dt*5);
  if(go){
    const H=car.hnd,mob=clamp(P.speed/9,0,1),latMax=(7+8*H)*lerp(1,.6,clamp(P.speed/85,0,1))*mob;
    P.vx+=(P.steerS*latMax-P.vx)*Math.min(1,d*(5+7*H));
    P.x+=P.vx*d;
    let hit=0;if(P.x>EDGE){P.x=EDGE;hit=1;}else if(P.x<-EDGE){P.x=-EDGE;hit=-1;}
    if(hit){
      if(P.vx*hit>0)P.vx*=-.25;
      P.speed=Math.max(0,P.speed-P.speed*.5*d);
      sparks(P.x+hit*.9,.3,(Math.random()-.5)*3,2,6);
      if(P.scrT<=0){Snd.scrape();vib(15);P.scrT=.3;P.shake=Math.max(P.shake,.35);}
    }
    P.scrT-=d;
    P.dist+=P.speed*d;P.score+=P.speed*d*.5;
  }else if(!P.crash){P.vx*=Math.exp(-dt*4);}
  else{P.x+=P.vx*d;P.vx*=Math.exp(-d*1.5);}
  if(P.comboT>0){P.comboT-=d;if(P.comboT<=0)P.combo=1;}
  /* visual body */
  if(P.crash){
    P.yaw+=P.spin*d;P.roll+=P.rollV*d;P.rollV*=Math.exp(-d*.8);P.spin*=Math.exp(-d*.8);
    P.y+=P.vy*d;P.vy-=25*d;if(P.y<0){P.y=0;P.vy=Math.abs(P.vy)>1.5?-P.vy*.4:0;}
    if(P.crashT<2.2&&Math.random()<.5)emit(P.x+(Math.random()-.5),.7,(Math.random()-.5)*2,(Math.random()-.5)*2,1.5,0,1.1,.7,1);
  }else{
    const ty=-Math.atan2(P.vx,Math.max(P.speed,12))*1.25;
    P.yaw+=(ty-P.yaw)*Math.min(1,dt*10);
    P.roll+=(P.vx*.0035-P.roll)*Math.min(1,dt*8);
    const tp=(go?.012:0)-(IN.brk&&go?.035:0)+P.nfx*.02;
    P.pitch+=(tp-P.pitch)*Math.min(1,dt*6);
    P.steerV=lerp(P.steerV||0,P.steerS*.35,Math.min(1,dt*12));
  }
  P.wheel+=Math.min(P.speed/car.wr,24)*dt;
  /* tire smoke */
  if(go&&((IN.brk&&P.speed>20)||(Math.abs(P.vx)>11&&P.speed>38))){
    P.smk-=dt;if(P.smk<=0){P.smk=.05;[-1,1].forEach(function(s){emit(P.x+s*.8,.15,car.L*.4,(Math.random()-.5)*.6,.5,0,.7,.45,1);});}
  }
  /* traffic */
  updateWorld(d,P.speed);
  if(go||P.crash){
    spawnT-=d;
    if(go){const target=Math.min(Q.tr,5+Math.floor(P.dist/450));let act=0;for(let i=0;i<NT;i++)if(TR[i].on)act++;
      if(act<target&&spawnT<=0){spawnTraffic();spawnT=.35+Math.random()*.6;}}
  }
  updTraffic(d,go);
  if(P.crash&&P.crashT>1.7&&state==='play')gameOver();
  cameraPlay(dt);
  /* audio */
  if(P.crash){Snd.update(50,300,0,clamp(P.speed/80,0,1)*.15,0,0);}
  else{
    const s6=clamp(P.speed/(topMS*1.05),0,.999)*6,g=Math.floor(s6),fr=s6-g;
    let rpm=.3+.7*fr;if(P.cd>0)rpm=.35+.35*Math.abs(Math.sin(time*7));
    const thr=go?1:.5,scr=(go&&IN.brk&&P.speed>20)?.09:((go&&Math.abs(P.vx)>11&&P.speed>38)?.05:0);
    Snd.update(42+rpm*100+P.nfx*10,350+rpm*1100+P.nfx*500,.15+.08*thr,clamp(P.speed/80,0,1)*.22,scr,P.nfx*.25);
  }
  hudUpdate();
}
function hudUpdate(){
  const kph=Math.round(P.speed*3.6);
  if(kph!==hc.sp){hc.sp=kph;vSpeed.textContent=kph;ring.style.setProperty('--p',clamp(kph/(CARS[S.car].top*1.3),0,1).toFixed(3));}
  const sc=Math.floor(P.score);if(sc!==hc.sc){hc.sc=sc;vScore.textContent=sc;}
  const ds=Math.floor(P.dist);if(ds!==hc.dist){hc.dist=ds;vDist.textContent=ds;}
  const nt=Math.round(P.nitro*100);if(nt!==hc.nit){hc.nit=nt;vNitro.style.width=nt+'%';}
  const cb=(P.comboT>0&&P.combo>1)?P.combo:0;if(cb!==hc.combo){hc.combo=cb;hCombo.textContent=cb?'x'+cb+' COMBO':'';}
  if(S.ctl===2)tiltDot.style.transform='translateX('+(P.steerS*11).toFixed(1)+'vh)';
}
function updateIdle(dt){
  updateWorld(dt,14);
  P.wheel+=Math.min(14/CARS[S.car].wr,24)*dt;
  P.steerV=0;
  cameraIdle(dt);
}
function updateOver(dt){
  const car=CARS[S.car];
  P.speed=Math.max(0,P.speed-(8+P.speed*1.1)*dt);
  P.yaw+=P.spin*dt;P.roll+=P.rollV*dt;P.rollV*=Math.exp(-dt*.8);P.spin*=Math.exp(-dt*.8);
  P.y+=P.vy*dt;P.vy-=25*dt;if(P.y<0){P.y=0;P.vy=0;}
  updateWorld(dt,P.speed);
  updTraffic(dt,false);
  if(Math.random()<.2)emit(P.x+(Math.random()-.5),.7,(Math.random()-.5)*2,(Math.random()-.5)*2,1.5,0,1.1,.7,1);
  P.wheel+=Math.min(P.speed/car.wr,24)*dt;
  cameraIdle(dt);
}

const skyBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

function setAttribs(n){for(let i=0;i<3;i++){if(i<n&&i>=nAttr)gl.enableVertexAttribArray(i);else if(i>=n&&i<nAttr)gl.disableVertexAttribArray(i);}nAttr=n;}
function resize(){

  let w=Math.floor(window.innerWidth*dpr*Q.sc),h=Math.floor(window.innerHeight*dpr*Q.sc);
  if(w>1920){h=Math.floor(h*1920/w);w=1920;}

function drawMesh(m,M){

function drawPlayer(){

function render(){

  gl.uniform1f(u.uNight,L.n);gl.uniform1f(u.uAlpha,1);gl.uniform3f(u.uHead,P.x,0,0);gl.uniform3f(u.uGlow,1,1,1);gl.uniform3f(u.uTint,1,1,1);

function buildFX(){
  fxN=0;
  const night=L.n,car=CARS[S.car],playing=(state==='play'||state==='over'||state==='pause');
  /* speed lines */

  if(la>.02&&state==='play')for(let i=0;i<Q.lines;i++){const len=lnL[i]*(.5+sp01+P.nfx);fxStreak(lnX[i],lnY[i],lnZ[i],lnX[i],lnY[i],lnZ[i]-len,.07,.85,.92,1,la);}
  /* particles */
  for(let i=0;i<Q.pt;i++){if(pL[i]<=0)continue;const k=pL[i]/pM[i],ty=pT[i];
    if(ty===0)fxStreak(pX[i],pY[i],pZ[i],pX[i]-pVX[i]*.04,pY[i]-pVY[i]*.04,pZ[i]-(pVZ[i]+scrollV)*.04,.05,1,.72,.28,k);
    else if(ty===1)fxSprite(pX[i],pY[i],pZ[i],pS[i],.75,.75,.78,k*.3);
    else fxSprite(pX[i],pY[i],pZ[i],pS[i],1,.5,.15,k*.7);}
  /* street lamps */
  if(night>.04&&Q.lamp>0){
    let cnt=0;
    for(let i=0;i<SG.length&&cnt<Q.lamp;i++){const s=SG[i],lm=SV[s.v].lamps;
      for(let j=0;j<lm.length&&cnt<Q.lamp;j++){const z=s.z+lm[j][2];if(z>6||z<-260)continue;cnt++;
        fxSprite(lm[j][0],lm[j][1],z,2.6,1,.85,.5,.7*night);
        fxFlat(lm[j][0]*.82,.06,z,9,15,1,.8,.45,.2*night);}}
  }
  if(!playing&&state!=='menu'&&state!=='garage'&&state!=='settings')return;
  /* player lights */
  const hw=car.W/2;
  if(night>.04&&!P.crash){
    fxFlat(P.x,.06,-22,6,46,1,.93,.7,.26*night);
    fxFlat(P.x,.06,-8,4.5,16,1,.93,.7,.22*night);
  }
  const brk=IN.brk&&P.cd<=0&&!P.crash&&state==='play';
  [-1,1].forEach(function(s){fxSprite(P.x+s*hw*.62,car.cl+car.bh*.6,car.L/2+.1,brk?.55:.28,1,.1,.08,brk?.9:(.25+night*.4));});
  if(P.nfx>.05&&state==='play'){
    [-1,1].forEach(function(s){
      const fx=P.x+s*.5,fl=2.2+Math.random()*2.2;
      fxStreak(fx,.42,car.L/2,fx,.42,car.L/2+fl,.26,.35,.65,1,P.nfx*.9);
      fxSprite(fx,.42,car.L/2+.3,.55+Math.random()*.25,.75,.9,1,P.nfx*.9);});
  }
  /* traffic tail glows at night */
  if(night>.12&&playing){
    for(let i=0;i<NT;i++){const t=TR[i];if(!t.on||t.z>14||t.z<-200)continue;
      [-1,1].forEach(function(s){fxSprite(t.x+s*t.hw*.6,.8,t.z+t.hl+.1,.5,1,.1,.08,.55*night);});}
  }
}

/* ================= UI ================= */
const vSpeed=$('v-speed'),vScore=$('v-score'),vDist=$('v-dist'),vNitro=$('v-nitro'),hCombo=$('hCombo'),ring=$('ring'),tiltDot=$('tiltDot'),popEl=$('pop'),cntEl=$('count'),fpsEl=$('fps');
function retrig(el,txt){el.textContent=txt;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}
function popup(t){retrig(popEl,t);}
function showCount(t){retrig(cntEl,t);}
const SCR=['menu','garage','settings','hud','pause','over'];
function show(n){SCR.forEach(function(s){$('s-'+s).classList.toggle('on',s===n);});}
function goMenu(){state='menu';resetVisual();show('menu');$('m-best').textContent=best;Snd.idle();}
function goGarage(){state='garage';resetVisual();show('garage');updGarage();}
function goSettings(){state='settings';show('settings');buildSettings();}
function applyCtl(){const h=$('s-hud');h.classList.remove('c0','c1','c2');h.classList.add('c'+S.ctl);}
function startGame(){
  Snd.init();Snd.resume();
  resetGame();applyCtl();state='play';show('hud');$('v-best').textContent=best;
  initTodAuto();
}
function initTodAuto(){}
function pauseGame(){if(state!=='play'||P.crash)return;state='pause';show('pause');Snd.idle();IN.l=IN.r=IN.brk=IN.nit=0;}
function resumeGame(){if(state!=='pause')return;state='play';show('hud');Snd.resume();}
function gameOver(){
  state='over';show('over');
  $('o-score').textContent=Math.floor(P.score);$('o-dist').textContent=Math.floor(P.dist)+' m';$('o-best').textContent=best;
  $('o-new').textContent=P.newBest?'NEW RECORD!':'';
  Snd.idle();IN.l=IN.r=IN.brk=IN.nit=0;
}
function updGarage(){
  const c=CARS[S.car];
  $('g-name').textContent=c.n;$('g-cls').textContent=c.d.toUpperCase()+'  \u00b7  '+(S.car+1)+'/'+CARS.length;
  const v=[c.top/32,c.acc/2.4,c.hnd*10],t=[c.top+' KM/H',v[1].toFixed(1)+' / 10',v[2].toFixed(1)+' / 10'];
  for(let i=0;i<3;i++){$('st'+i).style.width=clamp(v[i]*10,5,100)+'%';$('sv'+i).textContent=t[i];}
  const sw=$('g-sw').children;for(let i=0;i<sw.length;i++)sw[i].classList.toggle('on',i===S.col[S.car]);
}
(function(){
  const sw=$('g-sw');
  PAL.forEach(function(c,i){const d=document.createElement('div');d.style.background='rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
    d.addEventListener('click',function(){S.col[S.car]=i;saveS();updGarage();Snd.click();});sw.appendChild(d);});
})();
const SET=[
 {k:'q',l:'GRAPHICS QUALITY',o:['LOW','MEDIUM','HIGH'],v:[0,1,2]},
 {k:'ctl',l:'CONTROLS',o:['BUTTONS','WHEEL','TILT'],v:[0,1,2]},
 {k:'tod',l:'TIME OF DAY',o:['AUTO','DAY','SUNSET','NIGHT'],v:[0,1,2,3]},
 {k:'snd',l:'SOUND',o:['ON','OFF'],v:[1,0]},
 {k:'vol',l:'VOLUME',o:['30%','60%','100%'],v:[.3,.6,1]},
 {k:'sens',l:'TILT SENSITIVITY',o:['LOW','MID','HIGH'],v:[.7,1,1.5]},
 {k:'inv',l:'INVERT TILT',o:['OFF','ON'],v:[0,1]},
 {k:'fps',l:'FPS COUNTER',o:['OFF','ON'],v:[0,1]},
 {k:'hap',l:'VIBRATION',o:['ON','OFF'],v:[1,0]}
];
function buildSettings(){
  const g=$('set-grid');g.innerHTML='';
  SET.forEach(function(r){
    const row=document.createElement('div');row.className='row';
    const l=document.createElement('div');l.className='l';l.textContent=r.l;row.appendChild(l);
    const seg=document.createElement('div');seg.className='seg';
    r.o.forEach(function(name,i){
      const b=document.createElement('button');b.textContent=name;if(S[r.k]===r.v[i])b.classList.add('on');
      b.addEventListener('click',function(){S[r.k]=r.v[i];saveS();Snd.click();onSet(r.k);
        const bs=seg.children;for(let j=0;j<bs.length;j++)bs[j].classList.toggle('on',j===i);});
      seg.appendChild(b);});
    row.appendChild(seg);g.appendChild(row);
  });
}
function onSet(k){
  if(k==='q'){Q=QS[S.q];resize();initSegments();for(let i=0;i<NT;i++)TR[i].on=0;}
  else if(k==='snd'||k==='vol')Snd.setVol();
  else if(k==='fps')fpsEl.style.display=S.fps?'block':'none';
  else if(k==='ctl')applyCtl();
}
function hold(el,key){
  const dn=function(e){e.preventDefault();IN[key]=1;el.classList.add('dn');try{el.setPointerCapture(e.pointerId);}catch(_){}};
  const up=function(){IN[key]=0;el.classList.remove('dn');};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
}
hold($('b-left'),'l');hold($('b-right'),'r');hold($('b-brake'),'brk');hold($('b-nitro'),'nit');
(function(){
  const w=$('wheel'),wh=w.firstElementChild;let pid=-1,a0=0,r0=0,shown=0;
  const ang=function(e){const r=w.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));};
  w.addEventListener('pointerdown',function(e){e.preventDefault();pid=e.pointerId;try{w.setPointerCapture(pid);}catch(_){}a0=ang(e);r0=IN.wr;});
  w.addEventListener('pointermove',function(e){if(e.pointerId!==pid)return;let d=ang(e)-a0;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;IN.wr=clamp(r0+d,-1.5,1.5);});
  const up=function(e){if(e.pointerId===pid)pid=-1;};
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
  IN.wheelTick=function(dt){
    if(pid<0)IN.wr*=Math.exp(-dt*9);
    IN.wheel=clamp(IN.wr/1.1,-1,1);
    if(Math.abs(IN.wr-shown)>.002){shown=IN.wr;wh.style.transform='rotate('+(IN.wr*57.2958).toFixed(1)+'deg)';}
  };
})();
window.addEventListener('devicemotion',function(e){
  const g=e.accelerationIncludingGravity;if(!g||g.y==null)return;
  const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
  const ax=g.x||0,ay=g.y||0;let sr;
  if(a===90)sr=-ay;else if(a===270||a===-90)sr=ay;else if(a===180)sr=-ax;else sr=ax;
  let v=-sr/9.81;if(S.inv)v=-v;
  const dz=.04;v=Math.abs(v)<dz?0:(v-Math.sign(v)*dz);
  IN.tilt=clamp(v*S.sens/.42,-1,1);
});
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'brk',KeyS:'brk',Space:'nit',ShiftLeft:'nit'};
window.addEventListener('keydown',function(e){if(KM[e.code])IN[KM[e.code]]=1;});
window.addEventListener('keyup',function(e){if(KM[e.code])IN[KM[e.code]]=0;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('pointerdown',function(){Snd.init();Snd.resume();},{capture:true});
function bind(id,fn){$(id).addEventListener('click',function(){Snd.click();fn();});}
bind('b-drive',startGame);bind('b-garage',goGarage);bind('b-settings',goSettings);
bind('g-prev',function(){S.car=(S.car+CARS.length-1)%CARS.length;saveS();updGarage();});
bind('g-next',function(){S.car=(S.car+1)%CARS.length;saveS();updGarage();});
bind('g-go',startGame);bind('g-back',goMenu);bind('set-back',goMenu);
bind('b-pause',pauseGame);bind('p-res',resumeGame);bind('p-re',startGame);bind('p-menu',goMenu);
bind('o-retry',startGame);bind('o-garage',goGarage);bind('o-menu',goMenu);
window.__back=function(){
  if(state==='play'){pauseGame();return true;}
  if(state==='pause'){resumeGame();return true;}
  if(state==='garage'||state==='settings'||state==='over'){goMenu();return true;}
  return false;
};
window.__pause=function(){if(state==='play')pauseGame();Snd.suspend();};
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(state==='play')pauseGame();Snd.suspend();}
  else if(state!=='pause'){Snd.resume();}
});
window.addEventListener('resize',resize);

/* ================= main loop ================= */
let last=0,fAcc=0,fCnt=0;
function frame(now){
  requestAnimationFrame(frame);
  if(last===0){last=now;return;}
  const dtm=now-last;if(dtm<15.2)return;
  last=now;const dt=Math.min(dtm/1000,.05);
  if(state==='play'){if(IN.wheelTick)IN.wheelTick(dt);updatePlay(dt);}
  else if(state==='over')updateOver(dt);
  else if(state==='menu'||state==='garage'||state==='settings')updateIdle(dt);
  else if(state==='pause'){/* frozen */}
  render();
  if(S.fps){fAcc+=dtm;fCnt++;if(fAcc>=500){fpsEl.textContent=Math.round(fCnt*1000/fAcc)+' FPS';fAcc=0;fCnt=0;}}
}
buildAllMeshes();
resize();
initSegments();
fpsEl.style.display=S.fps?'block':'none';
$('m-best').textContent=best;$('v-best').textContent=best;
applyCtl();
requestAnimationFrame(frame);
})();
</script>
</body>
