plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.oukchaktrang.racing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oukchaktrang.racing'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // Keep APK small — no ABI splits needed for WebView-only app
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Self-signed debug key so GitHub Actions can produce a runnable APK
            // without needing a keystore secret for the first build.
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Merge assets from the assets folder cleanly
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // No other dependencies — entire game runs in WebView
}
